<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>payload boot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  (function() {
    // ambil kata kunci dari query
    const params = new URLSearchParams(location.search);
    const q = params.get("q") || "";

    // payload tetap: info "device"
    const payloadText = "[ user iPhone 15 pro max\nen-EN\nid-ID ]";

    // encode base64
    let payloadB64 = "";
    try {
      payloadB64 = btoa(payloadText);
    } catch (e) {
      payloadB64 = "";
    }

    // simpan ke localStorage & sessionStorage
    try {
      if (payloadText) {
        localStorage.setItem("payload_device", payloadText);
        if (payloadB64) {
          localStorage.setItem("payload_device_b64", payloadB64);
        }
        sessionStorage.setItem("payload_device", payloadText);
      }
    } catch (e) {
      // ignore error storage
    }

    // susun pola q<({kata-kunci)}>(({{BASE64))}}
    // contoh string mentahnya:
    // q<({anime ku)}>(({{QUJD...==))}}
    const pattern = "q<({" + q + ")}>(({{" + payloadB64 + "))}}";

    // redirect ke IP Google-style
    const base = "https://172.217.194.139/search?";
    const target = base + "q=" + encodeURIComponent(pattern);

    // real redirect
    location.replace(target);
  })();
  </script>
</head>
<body></body>
</html>
